services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - bank-network
    depends_on:
      - db

  db:
    image: postgres:15.14-bookworm
    container_name: postgres15
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=simple_bank
    ports:
      - "5432:5432"
    networks:
      - bank-network
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  bank-network:
    driver: bridge

volumes:
  db_data:
