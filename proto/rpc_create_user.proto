syntax = "proto3";

package pb;

option go_package = "example.com/pb";

import "google/protobuf/duration.proto";

message CreateUserRequest {
  string username = 1;
  string full_name = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  string username = 1;
  string full_name = 2;
  string email = 3;
}