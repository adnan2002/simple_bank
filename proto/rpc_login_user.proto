syntax = "proto3";

package pb;

option go_package = "example.com/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";



message LoginUserRequest {
  string username = 1;
  string password = 2;
}

message LoginUserResponse {
  string username = 1;
  string full_name = 2;
  string email = 3;
}
